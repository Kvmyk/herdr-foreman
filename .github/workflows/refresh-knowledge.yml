name: Refresh knowledge

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-knowledge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Refresh knowledge/agents.json
        run: node scripts/refresh-knowledge.js

      - name: Test
        run: npm test

      - name: Validate knowledge
        run: node bin/foreman.js knowledge validate knowledge/agents.json

      - name: Commit and push
        run: |
          changed=$( (git diff --name-only; git ls-files --others --exclude-standard) | sort -u )
          if [ -z "$changed" ]; then
            echo "No changes."
            exit 0
          fi
          unexpected=$(echo "$changed" | grep -v -x -e knowledge/agents.json -e docs/research/knowledge-log.md || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Refusing to commit unexpected changes:"
            echo "$unexpected"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $changed
          git commit -m "chore(knowledge): refresh $(date -u +%F)"
          git push origin HEAD:main
