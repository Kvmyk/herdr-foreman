    <rect x="120" y="392" width="34" height="8" rx="4"/>
    <rect x="230" y="376" width="52" height="8" rx="4"/>
    <rect x="230" y="392" width="40" height="8" rx="4"/>
    <rect x="340" y="376" width="52" height="8" rx="4"/>
    <rect x="340" y="392" width="28" height="8" rx="4"/>
