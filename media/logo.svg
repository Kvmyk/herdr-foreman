    <rect x="210" y="306" width="92" height="108" rx="16" fill="#17233A" stroke="#2D3F60"/>
    <rect x="320" y="306" width="92" height="108" rx="16" fill="#17233A" stroke="#2D3F60"/>
  </g>
  <g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M122 334 l16 13 l-16 13" stroke="#34D399"/>
    <path d="M232 334 l16 13 l-16 13" stroke="#FBBF24"/>
    <path d="M342 334 l16 13 l-16 13" stroke="#38BDF8"/>
